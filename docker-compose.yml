services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mailer}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mailer}
    ports:
      # порт слушает только сам сервер (для отладки/curl), наружу приложение отдаёт Caddy
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/public/uploads

  # Обратный прокси с автоматическим HTTPS (сам получает и продлевает сертификат Let's Encrypt
  # на DOMAIN из .env) — вариант проще и надёжнее ручной связки nginx+certbot на слабом сервере.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env — поддомен, направленный на IP этого сервера}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads-data:
  caddy-data:
  caddy-config:
